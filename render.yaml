# Render deployment configuration for zambia-procurement
# Defines a managed Postgres database and the backend web service.
# Docs: https://render.com/docs/yaml-spec

databases:
  - name: zambia-procurement-db
    databaseName: zambia_procurement
    user: zambia_procurement
    postgresMajorVersion: "15"
    region: frankfurt
    plan: free
    # Internal connection details are injected as DATABASE_URL automatically.

services:
  - type: keyvalue
    name: zambia-procurement-redis
    region: frankfurt
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: zambia-procurement-backend
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm install
    # Free-tier web services do not support preDeployCommand. Migrations are
    # idempotent, so run them immediately before each backend start instead.
    startCommand: npm run migrate:up && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24.14.1"
      - key: DATABASE_URL
        fromDatabase:
          name: zambia-procurement-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zambia-procurement-redis
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false # Set this as a secret in the Render dashboard
      - key: SIGNATURE_SECRET
        sync: false # Separate secret for tamper-evident digital signatures
      - key: PAYMENT_DATA_ENCRYPTION_KEY
        generateValue: true
      - key: PAYMENT_CALLBACK_BASE_URL
        value: https://zambia-procurement-backend.onrender.com
      - key: MTN_WEBHOOK_TOKEN
        generateValue: true
      - key: AIRTEL_WEBHOOK_TOKEN
        generateValue: true
      - key: BANK_WEBHOOK_TOKEN
        generateValue: true
      - key: MTN_MOMO_COLLECTION_SUBSCRIPTION_KEY
        sync: false
      - key: MTN_MOMO_COLLECTION_API_USER
        sync: false
      - key: MTN_MOMO_COLLECTION_API_KEY
        sync: false
      - key: MTN_MOMO_DISBURSEMENT_SUBSCRIPTION_KEY
        sync: false
      - key: MTN_MOMO_DISBURSEMENT_API_USER
        sync: false
      - key: MTN_MOMO_DISBURSEMENT_API_KEY
        sync: false
      - key: AIRTEL_CLIENT_ID
        sync: false
      - key: AIRTEL_CLIENT_SECRET
        sync: false
      - key: AIRTEL_DISBURSEMENT_PIN
        sync: false
      - key: BANK_API_BASE_URL
        sync: false
      - key: BANK_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://zedprocure.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: SYSTEM_ADMIN_PASSWORD
        sync: false
      - key: BUSINESS_ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        value: https://zedprocure.onrender.com
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_BACKEND_SERVICE_ID
        sync: false
      - key: RENDER_FRONTEND_SERVICE_ID
        sync: false

  - type: web
    name: zedprocure
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24.14.1"
      - key: REACT_APP_API_BASE_URL
        value: https://zambia-procurement-backend.onrender.com
